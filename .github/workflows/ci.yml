name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # la misma que el Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formato
        run: ruff format --check .
      - name: Tipos
        run: mypy
      - name: Tests
        run: pytest

  # Lo mismo que en producción: Postgres con la URL como la entrega Railway (postgres://).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/campo
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Migraciones
        run: |
          python -m app db migrar
          python -m app db migrar
          python -m app db estado | tee estado.txt
          grep -q "Coincide con el código" estado.txt
      - name: Tests sobre Postgres
        run: |
          psql postgresql://postgres:postgres@localhost:5432/campo -c "create database campo_test"
          pytest
