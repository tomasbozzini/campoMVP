# Configuración de Alembic para usarlo desde la terminal (alembic current, alembic history...).
# La URL de la base sale de DATABASE_URL (ver app/infra/migraciones/env.py).
# Para el día a día alcanza con:  python -m app db migrar

[alembic]
script_location = %(here)s/app/infra/migraciones
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
