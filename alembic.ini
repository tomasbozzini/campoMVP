# Configuración de Alembic para usarlo desde la terminal (alembic current, alembic history...).
# La URL de la base sale de DATABASE_URL (ver app/infra/migraciones/env.py).
# Para el día a día alcanza con:  python -m app db migrar

[alembic]
script_location = %(here)s/app/infra/migraciones
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

# Las migraciones generadas (alembic revision --autogenerate) se ordenan y formatean con
# ruff, con las reglas del proyecto, para que pasen el CI sin tocarlas a mano.
[post_write_hooks]
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix --config %(here)s/pyproject.toml REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --config %(here)s/pyproject.toml REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
